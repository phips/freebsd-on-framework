# Framework Generic
- name: Make power button suspend instead of turning off
  ansible.posix.sysctl:
    name: hw.acpi.power_button_state
    value: "S3"
    state: present
- name: Ethernet setup
  when: ansible_facts['default_ipv4'] == 'ue0'
  block:
    - name: Configure Ethernet Expansion Card IPv4 DHCP
      become: true
      community.general.sysrc:
        name: ifconfig_ue0
        value: "DHCP"
        state: present
    - name: Configure Ethernet Expansion Card IPv6 DHCP
      become: true
      community.general.sysrc:
        name: ifconfig_ue0_ipv6
        value: "inet6 accept_rtadv"
        state: present
- name: Install webcamd related packages
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop:
    - webcamd
    - v4l-utils
    - v4l_compat
- name: Load cuse driver
  community.general.sysrc:
    name: kld_list
    value: "cuse"
    state: value_present
- name: Add user to webcamd group
  user:
    name: '{{ ansible_user_id }}'
    groups: webcamd
    append: true
- name: Enable webcamd service
  community.general.sysrc:
    name: webcamd_enable
    value: "YES"
    state: present
# Xorg
- name: Add user to video group
  ansible.builtin.user:
    name: '{{ ansible_user_id }}'
    groups: video
    append: true
- name: Install Xorg packages
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop:
    - xorg
# GUI
- name: Install GUI packages
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop:
    - firefox
    - flameshot
    - noto-emoji
    - noto-tc
    - urwfonts

