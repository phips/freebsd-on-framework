# KDE
- name: Install KDE packages
  become: yes
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop:
    - kde
    - avahi
- name: sysrc settings
  community.general.sysrc:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
  loop:
    - {name: 'dbus_enable', value: "YES"}
    - {name: 'sddm_enable', value: "YES"}
    - {name: 'avahi_daemon_enable', value: "YES"}
- name: Increase message size for KDE
  become: yes
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "65536"
    state: present
  loop:
    - net.local.stream.recvspace
    - net.local.stream.sendspace
